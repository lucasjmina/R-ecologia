project:
  type: website
  output-dir: docs
website:
  title: "R aplicado a Ecología"
  navbar:
    left:
      - text: "Unidad 01"
        href: ./unidades/unidad_01.qmd
      - text: "Unidad 02"
        href: ./unidades/unidad_02.qmd
      - text: "Unidad 03"
        href: ./unidades/unidad_03.qmd
      - text: "Unidad 04"
        href: ./unidades/unidad_04.qmd
      - text: "Unidad 05"
        href: ./unidades/unidad_05.qmd

execute:
  output: false
  warning: false
  eval: false
date: now
date-format: YYYY
format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 2
    code-copy: true
    number-sections: true
    smooth-scroll: true
  pdf:
    documentclass: unne-guide
    mainfont: Libertinus Serif
    monofont: Adwaita Mono
    number-sections: true
    colorlinks: true
    linkcolor: "005D8A"
    include-in-header:
      text: |
        \usepackage{fvextra}
        \fvset{breaklines=true, commandchars=\\\{\}, breaksymbol={}, breakindentnchars=2}
